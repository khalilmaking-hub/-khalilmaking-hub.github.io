<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SalesOS · AI Sales Operating System</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
<script>tailwind.config={theme:{extend:{colors:{bg:'#0f0b1e',card:'#1a1530',ac:'#22d3ee'},fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}</script>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}body{background:radial-gradient(circle at 20% 0,#251a4a,#0f0b1e 55%);color:#e8e6f5;font-family:Inter,system-ui,sans-serif}
.glass{background:rgba(26,21,48,.75);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08)}
.sk{background:linear-gradient(90deg,#251f40,#2f2852,#251f40);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:8px}@keyframes sh{to{background-position:-200% 0}}
:focus-visible{outline:2px solid #22d3ee;outline-offset:2px}
.side,.panel{transition:transform .25s}.side{transform:translateX(-100%)}[dir=rtl] .side{transform:translateX(100%)}.side.open,.panel.open{transform:none!important}
.panel{transform:translateX(100%)}[dir=rtl] .panel{transform:translateX(-100%)}
@media(min-width:768px){.side{transform:none!important;position:static!important}}
.kc{transition:transform .15s,border-color .15s}.kc:hover{border-color:#22d3ee66;transform:translateY(-2px)}.over{outline:2px dashed #22d3ee88}
.fade{animation:f .4s}@keyframes f{from{opacity:0;transform:translateY(-6px)}}
input,select,textarea{background:#120e24;border:1px solid rgba(255,255,255,.12);border-radius:.5rem;padding:.4rem .6rem;font-size:.85rem;color:#e8e6f5}
.btn{border-radius:.5rem;padding:.4rem .8rem;font-size:.85rem;font-weight:500;background:rgba(255,255,255,.07);transition:background .15s}.btn:hover{background:rgba(255,255,255,.14)}
.pri{background:#22d3ee;color:#0f0b1e}.pri:hover{background:#67e8f9}.dng{background:rgba(239,68,68,.18);color:#fca5a5}
</style>
</head>
<body><div id="app" class="h-full"></div><div id="toasts" class="fixed bottom-4 end-4 z-[90] space-y-2" aria-live="polite"></div>
<script type="module">
/* ===== config + i18n ===== */
const USE_MOCK=true,BASE='/api';
const I18N={en:{dash:'Dashboard',leads:'Leads',inbox:'Conversations',insights:'AI Insights',agent:'AI Agent',whatsapp:'WhatsApp',ads:'Ads Attribution',billing:'Billing',settings:'Settings',hot:'Hot Leads',conv:'Converted',pipe:'In Pipeline',rev:'Total Revenue',stream:'Live Lead Stream',c1:'Daily conversions',c2:'Leads by source',c3:'Revenue trend',today:'Today',d7:'7d',d30:'30d',custom:'Custom',search:'Search name or phone…',add:'Add Lead',exp:'Export CSV',board:'Board',list:'List',new:'New',qualified:'Qualified',proposal:'Proposal',won:'Closed Won',lost:'Lost',h1:'Hot',view:'View',save:'Save',cancel:'Cancel',del:'Delete Lead',out:'Log out',login:'Sign in',forgot:'Forgot password?',email:'Email',pass:'Password',empty:'Nothing here yet',note:'Add note',pause:'Pause AI (take over)',resume:'Resume AI',assign:'Assign agent',stage:'Stage',value:'Deal value',name:'Name',phone:'Phone',source:'Source',summary:'AI summary',intent:'Extracted intent',why:'Score reasoning',wa:'Open WhatsApp',mw:'Mark Won',ml:'Mark Lost',all:'All',owner:'Owner-only area',vs:'vs last period',chat:'Chat transcript',usage:'AI messages'},
ur:{dash:'ڈیش بورڈ',leads:'لیڈز',inbox:'گفتگو',insights:'AI بصیرت',agent:'AI ایجنٹ',whatsapp:'واٹس ایپ',ads:'اشتہارات',billing:'بلنگ',settings:'سیٹنگز',hot:'ہاٹ لیڈز',conv:'کنورٹڈ',pipe:'پائپ لائن میں',rev:'کل آمدنی',stream:'لائیو لیڈ اسٹریم',c1:'روزانہ کنورژنز',c2:'ذریعہ کے لحاظ سے لیڈز',c3:'آمدنی کا رجحان',today:'آج',d7:'7 دن',d30:'30 دن',custom:'مخصوص',search:'نام یا فون تلاش کریں…',add:'لیڈ شامل کریں',exp:'CSV ایکسپورٹ',board:'بورڈ',list:'فہرست',new:'نئی',qualified:'اہل',proposal:'پیشکش',won:'کامیاب',lost:'ناکام',h1:'ہاٹ',view:'دیکھیں',save:'محفوظ کریں',cancel:'منسوخ',del:'لیڈ حذف کریں',out:'لاگ آؤٹ',login:'سائن اِن',forgot:'پاس ورڈ بھول گئے؟',email:'ای میل',pass:'پاس ورڈ',empty:'ابھی کچھ نہیں',note:'نوٹ شامل کریں',pause:'AI روکیں (خود سنبھالیں)',resume:'AI دوبارہ چلائیں',assign:'ایجنٹ تفویض کریں',stage:'مرحلہ',value:'ڈیل کی قیمت',name:'نام',phone:'فون',source:'ذریعہ',summary:'AI خلاصہ',intent:'نکالا گیا ارادہ',why:'اسکور کی وجہ',wa:'واٹس ایپ کھولیں',mw:'کامیاب کریں',ml:'ناکام کریں',all:'سب',owner:'صرف مالک کے لیے',vs:'پچھلے دور کے مقابلے',chat:'چیٹ ٹرانسکرپٹ',usage:'AI پیغامات'}};
const S={tok:null,user:null,V:null,leads:[],view:'board',page:'dash',lang:'en',range:'7d',f:{q:'',src:'',score:'',agent:''},ch:[],timer:null};
const store={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}},del(k){try{sessionStorage.removeItem(k)}catch(e){}}};
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const t=k=>I18N[S.lang][k]??I18N.en[k]??k;
const loc=()=>S.lang==='ur'?'ur-PK':'en-GB';
const money=n=>new Intl.NumberFormat(loc(),{style:'currency',currency:S.V.currency,maximumFractionDigits:0}).format(n);
const when=ts=>{const m=Math.round((Date.now()-ts)/6e4);return m<1?'now':m<60?m+'m':m<1440?Math.round(m/60)+'h':Math.round(m/1440)+'d'};
const clock=ts=>new Intl.DateTimeFormat(loc(),{timeZone:S.V.tz,hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'}).format(ts);
const icons=()=>window.lucide&&lucide.createIcons();
const STAGES=['new','qualified','proposal','won','lost'],SRC={whatsapp:['message-circle','text-green-400'],facebook:['facebook','text-blue-400'],instagram:['instagram','text-pink-400'],website:['globe','text-cyan-300']};
const SC={hot:'bg-red-500/15 text-red-300',new:'bg-slate-500/20 text-slate-300',qualified:'bg-cyan-500/15 text-cyan-300',proposal:'bg-amber-500/15 text-amber-300',won:'bg-green-500/15 text-green-300',lost:'bg-rose-500/15 text-rose-300'};
const tag=l=>(l.stage==='new'||l.stage==='qualified')&&l.score>=80?'hot':l.stage;
const badge=k=>`<span class="px-2 py-0.5 rounded-full text-xs font-medium ${SC[k]}">${t(k==='hot'?'h1':k)}</span>`;
const sc=n=>n>=75?'text-green-300 bg-green-500/15':n>=50?'text-amber-300 bg-amber-500/15':'text-red-300 bg-red-500/15';
const srcIco=s=>`<span class="h-8 w-8 shrink-0 rounded-lg bg-white/5 grid place-items-center ${SRC[s][1]}"><i data-lucide="${SRC[s][0]}" class="h-4 w-4"></i></span>`;
function toast(m,k='err'){const d=document.createElement('div');d.className=`glass fade px-4 py-2 rounded-lg text-sm border-s-4 ${k==='err'?'border-red-400':'border-green-400'}`;d.setAttribute('role','alert');d.textContent=m;$('#toasts').append(d);setTimeout(()=>d.remove(),4000)}
function confirmBox(msg){return new Promise(r=>{const d=document.createElement('div');d.className='fixed inset-0 z-[80] bg-black/60 grid place-items-center p-4';d.innerHTML=`<div role="alertdialog" aria-modal="true" class="glass rounded-2xl p-5 max-w-sm w-full"><p class="mb-4">${esc(msg)}</p><div class="flex gap-2 justify-end"><button class="btn" data-v="0">${t('cancel')}</button><button class="btn dng" data-v="1">OK</button></div></div>`;d.onclick=e=>{const b=e.target.closest('[data-v]');if(b||e.target===d){d.remove();r(b?.dataset.v==='1')}};document.body.append(d);$('[data-v="0"]',d).focus()})}

/* ===== api.js layer (mock now, FastAPI later) ===== */
const sleep=f=>new Promise((res,rej)=>setTimeout(()=>{try{res(f())}catch(e){rej(e)}},300));
async function call(method,path,body,mock){
  if(USE_MOCK)return sleep(mock);
  const r=await fetch(BASE+path,{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+S.tok},body:body?JSON.stringify(body):undefined});
  if(r.status===401){logout();throw new Error('Session expired')}
  if(!r.ok)throw new Error(await r.text()||r.status);return r.json();}
const NM=['Ayesha Khan','Bilal Ahmed','Sana Malik','Hamza Sheikh','Fatima Noor','Usman Ali','Zara Hussain','Imran Qureshi','Hira Baig','Danish Raza','Mehwish Iqbal','Talha Siddiqui','Noor Fatima','Faisal Mehmood'],PR=['Solar Panel 5kW','Bridal Collection','Website Package','Smart Watch','Furniture Set'],AG=['Ali','Sara','Owner'],SR=Object.keys(SRC);
const mk=(i,min)=>{const n=NM[i%NM.length],p=PR[i%5],v=(1+(i*7)%9)*15000,now=Date.now()-min*6e4;return{id:'L'+(1000+i),name:n,phone:'+92 3'+(10+i%40)+' '+(1234567+i*91113).toString().slice(0,7),source:SR[i%4],campaign:['Eid Sale','Brand Reach','Retarget','Organic'][i%4],stage:['new','new','qualified','proposal','won','qualified','lost','proposal','new','won','qualified','new','proposal','lost'][i%14],value:v,score:35+(i*37)%65,agent:AG[i%3],ts:now,tags:[p,i%2?'Repeat':'First-time'],ai:true,notes:[],
 why:`Asked price twice, mentioned budget, replies within ${2+i%5} min.`,summary:`${n.split(' ')[0]} is interested in ${p}, asked about installments and wants a quote this week.`,intent:{intent:'Purchase',budget:money0(v),product:p},
 chat:[{r:'c',m:`Assalam o Alaikum, ${p} ki price kya hai?`,ts:now-3e5},{r:'ai',m:`Walaikum Assalam ${n.split(' ')[0]}! ${p} starts at PKR ${v.toLocaleString()}. Shall I send a quote?`,ts:now-27e4},{r:'c',m:'Installment ho sakti hai?',ts:now-12e4},{r:'ai',m:'Yes, 6-month 0% installment is available. Want me to reserve one?',ts:now-9e4}]}};
const money0=v=>'PKR '+v.toLocaleString();
const DB=NM.map((_,i)=>mk(i,5+i*37));let seq=20;
const rnd=(a,i)=>Math.round(a+Math.abs(Math.sin(i*1.7))*a*.6);
const api={
 login:(email,password)=>call('POST','/auth/login',{email,password},()=>{if(!email||!password)throw new Error('Invalid credentials');return{token:'mock.jwt',user:{email,role:/agent/i.test(email)?'agent':'owner'},vendor:{name:'Demo User',plan:'Pro',used:320,limit:1000,currency:'PKR',tz:'Asia/Karachi'}}}),
 stats:r=>call('GET','/stats?range='+r,null,()=>{const n={today:6,'7d':7,'30d':10,custom:8}[r],m={today:1,'7d':5,'30d':20,custom:9}[r],L=Array.from({length:n},(_,i)=>r==='today'?`${i*4}:00`:`D${i+1}`);return{labels:L,daily:L.map((_,i)=>rnd(4,i)),revenue:L.map((_,i)=>rnd(90,i)*1000),sources:SR.map((_,i)=>DB.filter(l=>l.source===SR[i]).length*m),cards:{hot:[DB.filter(l=>tag(l)==='hot').length*m,12.4],conv:[DB.filter(l=>l.stage==='won').length*m,8.1],pipe:[DB.filter(l=>['qualified','proposal'].includes(l.stage)).length*m,-3.2],rev:[DB.filter(l=>l.stage==='won').reduce((a,l)=>a+l.value,0)*m,15.7]}}}),
 leads:()=>call('GET','/leads',null,()=>DB.map(l=>({...l}))),
 lead:id=>call('GET','/leads/'+id,null,()=>({...DB.find(l=>l.id===id)})),
 add:d=>call('POST','/leads',d,()=>{const l=mk(seq++,0);Object.assign(l,d,{stage:'new',chat:[],notes:[],ts:Date.now()});DB.unshift(l);return{...l}}),
 patch:(id,d)=>call('PATCH','/leads/'+id,d,()=>{const l=DB.find(x=>x.id===id);Object.assign(l,d);l.ts=Date.now();return{...l}}),
 note:(id,text)=>call('POST',`/leads/${id}/notes`,{text},()=>{const l=DB.find(x=>x.id===id);l.notes.unshift({ts:Date.now(),text});return{...l}}),
 del:id=>call('DELETE','/leads/'+id,null,()=>{DB.splice(DB.findIndex(l=>l.id===id),1);return{ok:true}}),
 stream:()=>call('GET','/stream',null,()=>{const l=mk(seq++,0);l.stage='new';DB.unshift(l);return{...l}})};

/* ===== auth / shell ===== */
function logout(){store.del('tok');clearInterval(S.timer);S.tok=null;login()}
function login(){$('#app').innerHTML=`<div class="h-full grid place-items-center p-4"><form id="lf" class="glass rounded-2xl p-6 w-full max-w-sm space-y-3"><h1 class="text-xl font-bold flex items-center gap-2"><i data-lucide="sparkles" class="text-ac"></i>SalesOS</h1><label class="block text-sm">${t('email')}<input id="em" type="email" required class="w-full mt-1" autocomplete="username"></label><label class="block text-sm">${t('pass')}<input id="pw" type="password" required class="w-full mt-1" autocomplete="current-password"></label><button class="btn pri w-full py-2">${t('login')}</button><button type="button" id="fg" class="text-xs text-ac">${t('forgot')}</button><p class="text-xs text-slate-400">Demo: any email/password. Include “agent” in the email for the Agent role.</p></form></div>`;icons();
 $('#fg').onclick=()=>toast('Reset link sent (mock)','ok');
 $('#lf').onsubmit=async e=>{e.preventDefault();try{const r=await api.login($('#em').value,$('#pw').value);S.tok=r.token;store.set('tok',r.token);S.user=r.user;S.V=r.vendor;boot()}catch(x){toast(x.message)}}}
function nav(){const it=[['dash','layout-dashboard'],['leads','kanban'],['inbox','message-square'],['insights','bar-chart-3'],['agent','bot'],['whatsapp','phone'],['ads','megaphone']];if(S.user.role==='owner')it.push(['billing','credit-card'],['settings','settings']);return it.map(([k,i])=>`<button data-go="${k}" aria-label="${t(k)}" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-start hover:bg-white/10 ${S.page===k?'bg-ac/15 text-ac':''}"><i data-lucide="${i}" class="h-4 w-4"></i>${t(k)}</button>`).join('')}
function shell(){const V=S.V,pc=Math.round(V.used/V.limit*100);document.documentElement.dir=S.lang==='ur'?'rtl':'ltr';document.documentElement.lang=S.lang;
 $('#app').innerHTML=`<div class="flex h-full"><aside id="side" class="side fixed md:static z-40 inset-y-0 start-0 w-64 glass flex flex-col p-4 bg-card"><div class="flex items-center gap-2 mb-6 font-bold text-lg"><span class="h-8 w-8 rounded-lg bg-ac/20 text-ac grid place-items-center"><i data-lucide="sparkles" class="h-4 w-4"></i></span>SalesOS</div><nav class="space-y-1 flex-1" aria-label="Main">${nav()}</nav>
 <div class="border-t border-white/10 pt-3 space-y-2"><div class="flex items-center gap-2"><span class="h-9 w-9 rounded-full bg-gradient-to-br from-ac to-purple-500 grid place-items-center font-bold text-bg">${esc(V.name[0])}</span><div class="min-w-0 flex-1"><p class="truncate text-sm font-medium">${esc(V.name)}</p><p class="text-xs text-slate-400 capitalize">${S.user.role}</p></div><span class="text-[10px] px-2 py-0.5 rounded-full bg-ac/20 text-ac">${V.plan}</span></div><div><div class="flex justify-between text-xs text-slate-400"><span>${t('usage')}</span><span>${V.used}/${V.limit}</span></div><div class="h-1.5 bg-white/10 rounded mt-1" role="progressbar" aria-valuenow="${pc}" aria-valuemin="0" aria-valuemax="100"><div class="h-full bg-ac rounded" style="width:${pc}%"></div></div></div></div></aside>
 <div id="scrim" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden"></div>
 <div class="flex-1 min-w-0 flex flex-col"><header class="flex items-center gap-2 p-3 border-b border-white/10"><button id="ham" class="btn md:hidden" aria-label="Menu"><i data-lucide="menu" class="h-4 w-4"></i></button><h2 class="font-semibold flex-1">${t(S.page)}</h2><button id="lg" class="btn" aria-label="Language">${S.lang==='en'?'اردو':'EN'}</button><button id="lo" class="btn" aria-label="${t('out')}"><i data-lucide="log-out" class="h-4 w-4"></i></button></header><main id="main" class="flex-1 overflow-auto p-3 md:p-5"></main></div></div><div id="panel" class="panel fixed inset-y-0 end-0 z-50 w-full max-w-md glass bg-card overflow-auto" role="dialog" aria-label="Lead detail"></div>`;
 const side=$('#side'),sc=$('#scrim'),tog=o=>{side.classList.toggle('open',o);sc.classList.toggle('hidden',!o)};
 $('#ham').onclick=()=>tog(true);sc.onclick=()=>tog(false);$('#lo').onclick=logout;
 $('#lg').onclick=()=>{S.lang=S.lang==='en'?'ur':'en';shell();route()};
 $$('[data-go]').forEach(b=>b.onclick=()=>{S.page=b.dataset.go;shell();route()});icons()}
function route(){clearInterval(S.timer);const m=$('#main');if(S.page==='dash')dash(m);else if(S.page==='leads')leadsPage(m);else if(PG[S.page]&&!((S.page==='billing'||S.page==='settings')&&S.user.role!=='owner'))PG[S.page](m);else m.innerHTML=`<div class="glass rounded-2xl p-10 text-center text-slate-400"><i data-lucide="lock" class="mx-auto mb-2"></i>${t('owner')}</div>`;icons()}
function boot(){shell();route()}

/* ===== dashboard ===== */
const sk=h=>`<div class="sk ${h}"></div>`;
async function dash(m){
 m.innerHTML=`<div class="flex flex-wrap items-center gap-2 mb-4" role="group">${['today','7d','30d','custom'].map(r=>`<button data-r="${r}" class="btn ${S.range===r?'pri':''}">${t(r==='7d'?'d7':r==='30d'?'d30':r)}</button>`).join('')}${S.range==='custom'?'<input type="date" aria-label="From"><input type="date" aria-label="To">':''}</div>
 <div id="cards" class="grid grid-cols-2 lg:grid-cols-4 gap-3">${sk('h-24')+sk('h-24')+sk('h-24')+sk('h-24')}</div>
 <div class="grid lg:grid-cols-3 gap-3 mt-3"><div class="glass rounded-2xl p-4"><h3 class="text-sm mb-2">${t('c1')}</h3><div class="relative h-52"><canvas id="c1"></canvas></div></div><div class="glass rounded-2xl p-4"><h3 class="text-sm mb-2">${t('c2')}</h3><div class="relative h-52"><canvas id="c2"></canvas></div></div><div class="glass rounded-2xl p-4"><h3 class="text-sm mb-2">${t('c3')}</h3><div class="relative h-52"><canvas id="c3"></canvas></div></div></div>
 <div class="glass rounded-2xl p-4 mt-3"><h3 class="text-sm mb-2 flex items-center gap-2"><span class="h-2 w-2 rounded-full bg-green-400 animate-pulse"></span>${t('stream')}</h3><ul id="stream" class="divide-y divide-white/5 max-h-80 overflow-auto"></ul></div>`;
 $$('[data-r]',m).forEach(b=>b.onclick=()=>{S.range=b.dataset.r;dash(m);icons()});
 try{const d=await api.stats(S.range);if(S.page!=='dash')return;
  const C=[['hot','flame',d.cards.hot[0]],['conv','trophy',d.cards.conv[0]],['pipe','funnel',d.cards.pipe[0]],['rev','wallet',money(d.cards.rev[0])]],dl=['hot','conv','pipe','rev'];
  $('#cards').innerHTML=C.map(([k,i,v],x)=>{const p=d.cards[k][1];return`<div class="glass rounded-2xl p-4"><div class="flex justify-between text-xs text-slate-400">${t(k)}<i data-lucide="${i}" class="h-4 w-4 text-ac"></i></div><p class="text-xl md:text-2xl font-bold mt-1">${v}</p><p class="text-xs mt-1 ${p>=0?'text-green-400':'text-red-400'}">${p>=0?'▲':'▼'} ${Math.abs(p)}% ${t('vs')}</p></div>`}).join('');
  Chart.defaults.color='#a8a2c4';S.ch.forEach(c=>c.destroy());const g={grid:{color:'rgba(255,255,255,.06)'}},o={maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:g,y:g}};
  S.ch=[new Chart($('#c1'),{type:'line',data:{labels:d.labels,datasets:[{data:d.daily,borderColor:'#22d3ee',backgroundColor:'rgba(34,211,238,.15)',fill:true,tension:.4}]},options:o}),
  new Chart($('#c2'),{type:'doughnut',data:{labels:SR,datasets:[{data:d.sources,backgroundColor:['#4ade80','#60a5fa','#f472b6','#22d3ee'],borderWidth:0}]},options:{maintainAspectRatio:false,cutout:'65%',plugins:{legend:{position:'bottom'}}}}),
  new Chart($('#c3'),{type:'bar',data:{labels:d.labels,datasets:[{data:d.revenue,backgroundColor:'#a78bfa',borderRadius:4}]},options:o})];
  const L=await api.leads();$('#stream').innerHTML=L.sort((a,b)=>b.ts-a.ts).slice(0,8).map(sRow).join('');icons();
  S.timer=setInterval(async()=>{try{const l=await api.stream();$('#stream')?.insertAdjacentHTML('afterbegin',sRow(l,1));S.leads=[];icons()}catch(e){}},8000);
 }catch(e){toast(e.message)}}
const sRow=(l,n)=>`<li class="${n?'fade':''}"><button data-view="${l.id}" class="w-full flex items-center gap-3 py-2 text-start hover:bg-white/5 rounded-lg px-1">${srcIco(l.source)}<span class="flex-1 min-w-0"><span class="block truncate text-sm">${esc(l.name)}</span><span class="block text-xs text-slate-400">${esc(l.campaign)} · ${when(l.ts)}</span></span>${badge(tag(l))}</button></li>`;

/* ===== leads: kanban + list ===== */

 <div class="grid lg:grid-cols-[2fr_1fr] gap-3">${card('Invoice history',`<table class="w-full text-sm"><thead class="text-xs text-slate-400"><tr><th class="text-start p-1">Invoice</th><th class="text-start">Date</th><th class="text-start">Amount</th><th>Status</th><th></th></tr></thead><tbody>${b.invoices.map(v=>`<tr class="border-t border-white/5"><td class="p-1">${v.id}</td><td>${v.d}</td><td>${money(v.amt)}</td><td class="text-center">${pill(v.s,SC.won)}</td><td><button class="btn text-xs" data-iv="${v.id}">Download</button></td></tr>`).join('')}</tbody></table>`)}${card('Payment method',`<p class="text-sm text-slate-400 mb-3">No card on file. Connect your payment gateway on the backend.</p><button class="btn" id="pm">Add payment method</button>`)}</div>`;
 $('#pm').onclick=()=>toast('Payment gateway not connected yet');
 $$('[data-iv]',m).forEach(x=>x.onclick=()=>{const v=b.invoices.find(i=>i.id===x.dataset.iv);dlf(v.id+'.txt',`${v.id}\n${v.d}\nAmount: ${money(v.amt)}\nStatus: ${v.s}`)});
 $$('[data-pl]',m).forEach(x=>x.onclick=async()=>{const p=PL[+x.dataset.pl];if(!await confirmBox(`Switch to the ${p[0]} plan?`))return;try{await api.setPlan(p[0],p[2]);shell();route();toast('Plan changed to '+p[0],'ok')}catch(e){toast(e.message)}});icons()});
